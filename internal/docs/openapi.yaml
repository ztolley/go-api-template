basePath: /
definitions:
  user.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
    type: object
info:
  contact:
    email: ztolley@exsiteconsultants.com
    name: Zac Tolley
    url: https://exsite.dev
  description: This is a sample server for a user API.
  license:
    name: MIT
  title: User API
  version: "1.0"
paths:
  /users:
    get:
      consumes:
      - application/json
      description: Get all users from the db
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
      summary: Get all users from the database
      tags:
      - users
  /users/{userID}:
    get:
      consumes:
      - application/json
      description: Get a user by ID
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
      summary: Get a user by ID
      tags:
      - users
swagger: "2.0"
